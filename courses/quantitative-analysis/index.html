<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>定量分析 · 讲义目录</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --paper: #ffffff;
      --ink: #1a1918;
      --muted: #73706b;
      --line: #e3dfd7;
      --red: #94070a;
      --red-hover: #730508;
      --serif: "Songti SC", "Noto Serif CJK SC", STSong, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: "SF Mono", Menlo, Consolas, Monaco, monospace;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--ink);
      text-decoration: none;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    header.site-nav {
      background-color: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--muted);
    }

    .breadcrumbs a {
      color: var(--muted);
    }

    .breadcrumbs a:hover {
      color: var(--ink);
    }

    .breadcrumbs .sep {
      color: var(--line);
      font-size: 11px;
    }

    .breadcrumbs .current {
      color: var(--ink);
      font-weight: 600;
    }

    .page-header {
      padding: 40px 0 24px;
    }

    h1.page-title {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
    }

    .lecture-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 48px;
    }

    .lecture-item {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s ease;
    }

    .lecture-item:hover {
      border-color: #b8b3a8;
    }

    .lecture-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .chap-num {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
      width: 28px;
      flex-shrink: 0;
    }

    .chap-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
    }

    .lecture-item:hover .chap-title {
      color: var(--red);
    }

    .lecture-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .lecture-item svg {
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      transition: stroke 0.15s ease, transform 0.15s ease;
    }

    .lecture-item:hover svg {
      stroke: var(--red);
      transform: translateX(3px);
    }

    footer.site-footer {
      margin-top: auto;
      border-top: 1px solid var(--line);
      background-color: var(--paper);
      padding: 20px 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
