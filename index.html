<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Panziel's Space</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --paper: #ffffff;
      --ink: #1a1918;
      --muted: #73706b;
      --line: #e3dfd7;
      --red: #94070a;
      --red-hover: #730508;
      --serif: "Songti SC", "Noto Serif CJK SC", STSong, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: "SF Mono", Menlo, Consolas, Monaco, monospace;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--red);
      text-decoration: none;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    header.site-nav {
      background-color: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
    }

    .brand {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .page-header {
      padding: 40px 0 24px;
    }

    h1.page-title {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
    }

    .category-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 48px;
    }

    .category-item {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 24px;
      transition: border-color 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-item:hover {
      border-color: #b8b3a8;
    }

    .category-link {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      display: block;
      flex-grow: 1;
    }

    .category-item:hover .category-link {
      color: var(--red);
    }

    .category-meta {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-item svg {
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      transition: stroke 0.15s ease, transform 0.15s ease;
    }

    .category-item:hover svg {
      stroke: var(--red);
      transform: translateX(3px);
    }

    footer.site-footer {
      margin-top: auto;
      border-top: 1px solid var(--line);
      background-color: var(--paper);
      padding: 20px 0;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="site-nav">
    <div class="container">
      <div class="brand">Panziel's Space</div>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1 class="page-title">Panziel's Space</h1>
    </div>

    <ul class="category-list">
      <li>
        <a class="category-item" href="courses/ai-intro/">
          <span class="category-link">人工智能导论</span>
          <span class="category-meta">
            5 篇讲义
            <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </span>
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>GitHub Pages</span>
    </div>
  </footer>

</body>
</html>
